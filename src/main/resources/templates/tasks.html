<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link" th:href="@{/guests}">Guests</a>
            <a class="nav-link active" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link" th:href="@{/vendors}">Vendors</a>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">Tasks</h1>

        <p class="text-muted">
            Keep track of everything that needs to be done before the wedding.
        </p>
    </div>

    <div class="card shadow-sm mb-5">

        <div class="card-body">

            <h4 class="card-title mb-4">
                Add task
            </h4>

            <form th:action="@{/tasks/save}"
                  th:object="${task}"
                  method="post">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="title" class="form-label">Title</label>

                        <input type="text"
                               id="title"
                               th:field="*{title}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">

                        <label for="dueDate" class="form-label">Due date:</label>

                        <input type="date"
                               id="dueDate"
                               th:field="*{dueDate}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">

                        <label for="priority" class="form-label">Priority:</label>

                        <select id="priority"
                                th:field="*{priority}"
                                class="form-select">

                            <option th:each="priority : ${priorities}"
                                    th:value="${priority}"
                                    th:text="${priority}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label for="status" class="form-label">Status:</label>

                        <select id="status"
                                th:field="*{status}"
                                class="form-select">

                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                    </div>

                    <div class="col-12">

                        <label for="description" class="form-label">Description:</label>

                        <textarea id="description"
                                  th:field="*{description}"
                                  class="form-control"
                                  rows="3">
                </textarea>

                    </div>

                </div>

                <button type="submit" class="btn btn-dark mt-4">Add task</button>

            </form>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h4 class="card-title mb-0">Task list</h4>

                <span class="text-muted">
            Total:
            <strong th:text="${tasks.size()}"></strong>
        </span>

            </div>

            <div class="row g-4 mb-4">

                <div class="col-md-5">

                    <form th:action="@{/tasks}"
                          method="get"
                          class="d-flex gap-2">

                        <select id="filterStatus"
                                name="status"
                                class="form-select">

                            <option value="">All statuses</option>

                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                        <button type="submit"
                                class="btn btn-outline-dark">
                            Filter
                        </button>

                    </form>

                </div>

                <div class="col-md-5">

                    <form th:action="@{/tasks}"
                          method="get"
                          class="d-flex gap-2">

                        <select id="filterPriority"
                                name="priority"
                                class="form-select">

                            <option value="">All priorities</option>

                            <option th:each="priority : ${priorities}"
                                    th:value="${priority}"
                                    th:text="${priority}">
                            </option>

                        </select>

                        <button type="submit"
                                class="btn btn-outline-dark">
                            Filter
                        </button>

                    </form>

                </div>

                <div class="col-md-2">

                    <a th:href="@{/tasks}"
                       class="btn btn-outline-secondary w-100">
                        Clear
                    </a>

                </div>

            </div>


            <div th:if="${tasks.isEmpty()}"
                 class="alert alert-secondary">
                No tasks have been added yet.
            </div>

            <div th:if="${!tasks.isEmpty()}" class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Due date</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Deadline</th>
                        <th>Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="task : ${tasks}">
                        <td th:text="${task.title}"></td>
                        <td th:text="${task.description}"></td>
                        <td th:text="${task.dueDate}"></td>
                        <td th:text="${task.priority}"></td>
                        <td th:text="${task.status}"></td>
                        <td>
              <span th:if="${task.overdue}">
                Overdue
              </span>

                            <span th:unless="${task.overdue}">
                -
              </span>
                        </td>
                        <td>
                            <a th:href="@{/tasks/edit/{id}(id=${task.id})}"
                               class="btn btn-outline-dark btn-sm">
                                Edit
                            </a>

                            <form th:action="@{/tasks/delete/{id}(id=${task.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="mt-4">

        <a th:href="@{/}" class="btn btn-outline-secondary">Back to dashboard</a>

    </div>

</div>


</body>
</html>
