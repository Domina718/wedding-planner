<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks | Wedding Planner</title>
</head>
<body>

<h1>Tasks</h1>

<a th:href="@{/}">Back to dashboard</a>

<h2>Add task</h2>

<form th:action="@{/tasks/save}"
      th:object="${task}"
      method="post">

  <div>
    <label for="title">Title:</label>
    <input type="text"
           id="title"
           th:field="*{title}"
           required>
  </div>

  <br>

  <div>
    <label for="description">Description:</label>
    <textarea id="description"
              th:field="*{description}">
    </textarea>
  </div>

  <br>

  <div>
    <label for="dueDate">Due date:</label>
    <input type="date"
           id="dueDate"
           th:field="*{dueDate}"
           required>
  </div>

  <br>

  <div>
    <label for="priority">Priority:</label>

    <select id="priority"
            th:field="*{priority}">

      <option th:each="priority : ${priorities}"
              th:value="${priority}"
              th:text="${priority}">
      </option>

    </select>
  </div>

  <br>

  <div>
    <label for="status">Status:</label>

    <select id="status"
            th:field="*{status}">

      <option th:each="status : ${statuses}"
              th:value="${status}"
              th:text="${status}">
      </option>

    </select>
  </div>

  <br>

  <button type="submit">Add task</button>

</form>

<hr>

<h2>Task list</h2>

<h3>Filter</h3>

<form th:action="@{/tasks}" method="get">

  <label for="filterStatus">Status:</label>

  <select id="filterStatus" name="status">
    <option value="">All</option>

    <option th:each="status : ${statuses}"
            th:value="${status}"
            th:text="${status}">
    </option>
  </select>

  <button type="submit">Filter</button>

</form>

<br>

<form th:action="@{/tasks}" method="get">

  <label for="filterPriority">Priority:</label>

  <select id="filterPriority" name="priority">
    <option value="">All</option>

    <option th:each="priority : ${priorities}"
            th:value="${priority}"
            th:text="${priority}">
    </option>
  </select>

  <button type="submit">Filter</button>

</form>

<br>

<a th:href="@{/tasks}">Clear filters</a>

<p th:if="${tasks.isEmpty()}">
  No tasks found.
</p>

<table th:if="${!tasks.isEmpty()}" border="1">

  <thead>
  <tr>
    <th>Title</th>
    <th>Description</th>
    <th>Due date</th>
    <th>Priority</th>
    <th>Status</th>
    <th>Deadline</th>
    <th>Actions</th>
  </tr>
  </thead>

  <tbody>

  <tr th:each="task : ${tasks}">
    <td th:text="${task.title}"></td>
    <td th:text="${task.description}"></td>
    <td th:text="${task.dueDate}"></td>
    <td th:text="${task.priority}"></td>
    <td th:text="${task.status}"></td>
    <td>
      <span th:if="${task.overdue}">
        Overdue
      </span>

      <span th:unless="${task.overdue}">
        -
      </span>
    </td>
    <td>
      <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a>

      <form th:action="@{/tasks/delete/{id}(id=${task.id})}"
            method="post"
            styles="display:inline;">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>

  </tbody>

</table>

</body>
</html>
