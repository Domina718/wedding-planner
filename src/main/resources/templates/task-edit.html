<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Task | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link" th:href="@{/guests}">Guests</a>
            <a class="nav-link active" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link" th:href="@{/vendors}">Vendors</a>
            <form th:action="@{/logout}"
                  method="post"
                  class="ms-3">
                <button type="submit"
                        class="btn btn-outline-danger btn-sm">
                    Logout
                </button>
            </form>
        </div>

    </div>
</nav>


<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">
            Edit task
        </h1>

        <p class="text-muted">
            Update task, details, priority and status.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/tasks/update}"
                  th:object="${task}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="title"
                               class="form-label">
                            Title
                        </label>

                        <input type="text"
                               id="title"
                               th:field="*{title}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">

                        <label for="dueDate"
                               class="form-label">
                            Due date
                        </label>

                        <input type="date"
                               id="dueDate"
                               th:field="*{dueDate}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">

                        <select id="priority"
                                th:field="*{priority}"
                                class="form-select">

                            <option th:each="priority : ${priorities}"
                                    th:value="${priority}"
                                    th:text="${priority}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label for="status"
                               class="form-label">
                            Status
                        </label>

                        <select id="status"
                                th:field="*{status}"
                                class="form-select">

                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                    </div>

                    <div class="col-12">

                        <label for="description"
                               class="form-label">
                            Description
                        </label>

                        <textarea id="description"
                                  th:field="*{description}"
                                  class="form-control"
                                  rows="4">
            </textarea>

                    </div>

                </div>

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-dark">
                        Save changes
                    </button>

                    <a th:href="@{/tasks}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
