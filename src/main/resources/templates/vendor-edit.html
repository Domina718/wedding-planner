<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Vendor | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link" th:href="@{/guests}">Guests</a>
            <a class="nav-link" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link active" th:href="@{/vendors}">Vendors</a>
            <form th:action="@{/logout}"
                  method="post"
                  class="ms-3">
                <button type="submit"
                        class="btn btn-outline-danger btn-sm">
                    Logout
                </button>
            </form>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">
            Edit vendor
        </h1>

        <p class="text-muted">
            Update vendor information, pricing and booking status.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/vendors/update}"
                  th:object="${vendorRequest}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="name"
                               class="form-label">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="serviceType"
                               class="form-label">
                            Service type
                        </label>

                        <select id="serviceType"
                                th:field="*{serviceType}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('serviceType')} ? 'is-invalid'">

                            <option value="">Select service</option>

                            <option th:each="type : ${serviceTypes}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>

                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('serviceType')}"
                             th:errors="*{serviceType}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="email"
                               class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="phone"
                               class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               id="phone"
                               th:field="*{phone}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">

                        <label for="estimatedPrice"
                               class="form-label">
                            Estimated price
                        </label>

                        <input type="number"
                               id="estimatedPrice"
                               th:field="*{estimatedPrice}"
                               min="0"
                               step="0.01"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('estimatedPrice')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('estimatedPrice')}"
                             th:errors="*{estimatedPrice}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="depositAmount"
                               class="form-label">
                            Deposit amount
                        </label>

                        <input type="number"
                               id="depositAmount"
                               th:field="*{depositAmount}"
                               min="0"
                               step="0.01"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('depositAmount')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('depositAmount')}"
                             th:errors="*{depositAmount}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="status"
                               class="form-label">
                            Status
                        </label>

                        <select id="status"
                                th:field="*{status}"
                                class="form-select">

                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                    </div>

                    <div class="mt-4">

                        <button type="submit"
                                class="btn btn-outline-dark">
                            Save changes
                        </button>

                        <a th:href="@{/vendors}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
