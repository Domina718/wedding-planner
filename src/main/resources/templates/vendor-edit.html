<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Vendor | Wedding Planner</title>
</head>
<body>

<h1>Edit vendor</h1>

<form th:action="@{/vendors/update}"
      th:object="${vendor}"
      method="post">

  <input type="hidden" th:field="*{id}">

  <div>
    <label for="name">Name:</label>
    <input type="text"
           id="name"
           th:field="*{name}"
           required>
  </div>

  <br>

  <div>
    <label for="serviceType">Sevice type:</label>

    <select id="serviceType"
            th:field="*{serviceType}"
            required>

      <option th:each="type : ${serviceTypes}"
              th:value="${type}"
              th:text="${type}">
      </option>

    </select>
  </div>

  <br>

  <div>
    <label for="email">Email:</label>
    <input type="email"
           id="email"
           th:field="*{email}">
  </div>

  <br>

  <div>
    <label for="phone">Phone</label>
    <input type="text"
           id="phone"
           th:field="*{phone}">
  </div>

  <br>

  <div>
    <label for="estimatedPrice">Estimated price:</label>
    <input type="number"
           id="estimatedPrice"
           th:field="*{estimatedPrice}"
           min="0"
           step="0.01">
  </div>

  <br>

  <div>
    <label for="depositAmount">Deposit amount:</label>
    <input type="number"
           id="depositAmount"
           th:field="*{depositAmount}"
           min="0"
           step="0.01">
  </div>

  <br>

  <div>
    <label for="status">Status:</label>

    <select id="status" th:field="*{status}">
      <option th:each="status : ${statuses}"
              th:value="${status}"
              th:text="${status}">
      </option>
    </select>
  </div>

  <br>

  <button type="submit">Save changes</button>

</form>

<br>

<a th:href="@{/vendors}">Back to vendors</a>

</body>
</html>
