<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Not Found | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link" th:href="@{/guests}">Guests</a>
            <a class="nav-link" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link" th:href="@{/vendors}">Vendors</a>

            <form th:action="@{/logout}"
                  method="post"
                  class="ms-3">
                <button type="submit"
                        class="btn btn-outline-danger btn-sm">
                    Logout
                </button>
            </form>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="card shadow-sm">
        <div class="card-body text-center py-5">

            <h1 class="display-5 fw-bold mb-3">
                Resource not found
            </h1>

            <p class="text-muted mb-4"
               th:text="${errorMessage}">
                The requested resource could not be found.
            </p>

            <a th:href="@{/}"
               class="btn btn-dark">
                Back to dashboard
            </a>

        </div>
    </div>

</div>

</body>
</html>
