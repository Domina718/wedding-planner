<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Guest | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link active" th:href="@{/guests}">Guests</a>
            <a class="nav-link" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link" th:href="@{/vendors}">Vendors</a>
            <form th:action="@{/logout}"
                  method="post"
                  class="ms-3">
                <button type="submit"
                        class="btn btn-outline-danger btn-sm">
                    Logout
                </button>
            </form>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">Edit guest</h1>

        <p class="text-muted">
            Update guest information and RSVP details.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/guests/update}"
                  th:object="${guestRequest}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="firstName"
                               class="form-label">
                            First name
                        </label>

                        <input type="text"
                               id="firstName"
                               th:field="*{firstName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('firstName')}"
                             th:errors="*{firstName}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="lastName"
                               class="form-label">
                            Last name
                        </label>

                        <input type="text"
                               id="lastName"
                               th:field="*{lastName}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('lastName')}"
                             th:errors="*{lastName}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="email"
                               class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="phone"
                               class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               id="phone"
                               th:field="*{phone}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">

                        <label for="rsvpStatus"
                               class="form-label">
                            RSVP status
                        </label>

                        <select id="rsvpStatus"
                                th:field="*{rsvpStatus}"
                                class="form-select">

                            <option th:each="status : ${rsvpStatuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-check mt-4">

                    <input type="checkbox"
                           id="plusOne"
                           th:field="*{plusOne}"
                           class="form-check-input">

                    <label for="plusOne"
                           class="form-check-label">
                        Plus one
                    </label>


                </div>

                <div id="plusOneFields"
                     class="mt-3">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label for="plusOneFirstName"
                                   class="form-label">
                                Plus-one first name
                            </label>

                            <input type="text"
                                   id="plusOneFirstName"
                                   th:field="*{plusOneFirstName}"
                                   class="form-control">
                        </div>

                        <div class="col-md-6">

                            <label for="plusOneLastName"
                                   class="form-label">
                                Plus-one last name
                            </label>

                            <input type="text"
                                   id="plusOneLastName"
                                   th:field="*{plusOneLastName}"
                                   class="form-control">
                        </div>

                    </div>

                </div>

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-dark">
                        Save changes
                    </button>

                    <a th:href="@{/guests}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>


</div>

<script>
  const plusOneCheckbox = document.getElementById("plusOne");
  const plusOneFields = document.getElementById("plusOneFields");

  function togglePlusOneFields() {
    plusOneFields.style.display = plusOneCheckbox.checked ? "block" : "none";
  }

  plusOneCheckbox.addEventListener("change", togglePlusOneFields);
  togglePlusOneFields();

</script>

</body>
</html>
