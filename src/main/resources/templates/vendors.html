<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendors | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link" th:href="@{/guests}">Guests</a>
            <a class="nav-link" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link active" th:href="@{/vendors}">Vendors</a>
            <form th:action="@{/logout}"
                  method="post"
                  class="ms-3">
                <button type="submit"
                        class="btn btn-outline-danger btn-sm">
                    Logout
                </button>
            </form>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">
            Vendors
        </h1>

        <p class="text-muted">
            Manage wedding vendors, payments and booking status.
        </p>

    </div>

    <div class="card shadow-sm mb-5">

        <div class="card-body">

            <h4 class="card-title mb-4">
                Add vendor
            </h4>

            <form th:action="@{/vendors/save}"
                  th:object="${vendorRequest}"
                  method="post">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="name"
                               class="form-label">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="serviceType"
                               class="form-label">
                            Service type
                        </label>

                        <select id="serviceType"
                                th:field="*{serviceType}"
                                class="form-select"
                                th:classappend="${#fields.hasErrors('serviceType')} ? 'is-invalid'">

                            <option value="">Select service</option>

                            <option th:each="type : ${serviceTypes}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>

                        </select>

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('serviceType')}"
                             th:errors="*{serviceType}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="email"
                               class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="phone"
                               class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               id="phone"
                               th:field="*{phone}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">

                        <label for="estimatedPrice"
                               class="form-label">
                            Estimated price
                        </label>

                        <input type="number"
                               id="estimatedPrice"
                               th:field="*{estimatedPrice}"
                               min="0"
                               step="0.01"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('estimatedPrice')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('estimatedPrice')}"
                             th:errors="*{estimatedPrice}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="depositAmount"
                               class="form-label">
                            Deposit amount
                        </label>

                        <input type="number"
                               id="depositAmount"
                               th:field="*{depositAmount}"
                               min="0"
                               step="0.01"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('depositAmount')} ? 'is-invalid'">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('depositAmount')}"
                             th:errors="*{depositAmount}">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <label for="status"
                               class="form-label">
                            Status
                        </label>

                        <select id="status"
                                th:field="*{status}"
                                class="form-select">

                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-dark mt-4">
                    Add vendor
                </button>

            </form>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h4 class="card-title mb-0">
                    Vendor list
                </h4>

                <span class="text-muted">
                    Shown:
                    <strong th:text="${vendors.size()}"></strong>
                </span>

            </div>

            <form th:action="@{/vendors}"
                  method="get"
                  class="row g-2 mb-4">

                <div class="col-md-4">

                    <select id="filterServiceType"
                            name="serviceType"
                            class="form-select">

                        <option value="">All service types</option>

                        <option th:each="type : ${serviceTypes}"
                                th:value="${type}"
                                th:text=${type}>
                        </option>

                    </select>

                </div>

                <div class="col-md-4">

                    <select id="filterStatus"
                            name="status"
                            class="form-select">

                        <option value="">All statuses</option>

                        <option th:each="status : ${statuses}"
                                th:value="${status}"
                                th:text=${status}>
                        </option>

                    </select>

                </div>

                <div class="col-auto">

                    <button type="submit"
                            class="btn btn-outline-dark">
                        Filter
                    </button>

                </div>

                <div class="col-auto">

                    <a th:href="@{/vendors}"
                       class="btn btn-outline-secondary">
                        Clear filter
                    </a>

                </div>

            </form>

            <div th:if="${vendors.isEmpty()}"
                 class="alert alert-secondary">
                No vendors found.
            </div>

            <div th:if="${!vendors.isEmpty()}"
                 class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th>Name</th>
                        <th>Service</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Estimated price</th>
                        <th>Deposit</th>
                        <th>Remaining</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="vendor : ${vendors}">
                        <td th:text="${vendor.name}"></td>
                        <td th:text="${vendor.serviceType}"></td>
                        <td th:text="${vendor.email}"></td>
                        <td th:text="${vendor.phone}"></td>
                        <td th:text="${vendor.estimatedPrice}"></td>
                        <td th:text="${vendor.depositAmount}"></td>
                        <td th:text="${vendor.remainingAmount}"></td>
                        <td>
                            <span class="badge"
                                  th:text="${vendor.status}"
                                  th:classappend="${vendor.status.name() == 'PAID'} ? ' text-bg-success' :
                                                  (${vendor.status.name() == 'BOOKED'} ? ' text-bg-warning' :
                                                  (${vendor.status.name() == 'CONTACTED'} ? ' text-bg-primary' :
                                                  ' text-bg-secondary')">
                            </span>
                        </td>

                        <td>
                            <a th:href="@{/vendors/edit/{id}(id=${vendor.id})}"
                               class="btn btn-outline-dark btn-sm">
                                Edit
                            </a>

                            <form th:action="@{/vendors/delete/{id}(id=${vendor.id})}"
                                  method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Are you sure you want to delete this vendor?');">

                                <button type="submit"
                                        class="btn btn-outline-danger btn-sm">
                                    Delete
                                </button>

                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="mt-4">

        <a th:href="@{/}"
           class="btn btn-outline-secondary">
            Back to dashboard
        </a>

    </div>


</div>

</body>
</html>
