<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vendors | Wedding Planner</title>
</head>
<body>

<h1>Vendors</h1>

<a th:href="@{/}">Back to dashboard</a>

<h2>Add vendor</h2>

<form th:action="@{/vendors/save}"
      th:object="${vendor}"
      method="post">

  <div>
    <label for="name">Name:</label>
    <input type="text"
           id="name"
           th:field="*{name}"
           required>
  </div>

  <br>

  <div>
    <label for="serviceType">Service type:</label>
    <select id="serviceType"
            th:field="*{serviceType}"
            required>

      <option value="">Select service</option>

      <option th:each="type : ${serviceTypes}"
              th:value="${type}"
              th:text="${type}">
      </option>

    </select>
  </div>

  <br>

  <div>
    <label for="email">Email:</label>
    <input type="email"
           id="email"
           th:field="*{email}">
  </div>

  <br>

  <div>
    <label for="phone">Phone:</label>
    <input type="text"
           id="phone"
           th:field="*{phone}">
  </div>

  <br>

  <div>
    <label for="estimatedPrice">Estimated price:</label>
    <input type="number"
           id="estimatedPrice"
           th:field="*{estimatedPrice}"
           min="0"
           step="0.01">
  </div>

  <br>

  <div>
    <label for="depositAmount">Deposit amount:</label>
    <input type="number"
           id="depositAmount"
           th:field="*{depositAmount}"
           min="0"
           step="0.01">
  </div>

  <br>

  <div>
    <label for="status">Status:</label>

    <select id="status"
            th:field="*{status}">

      <option th:each="status : ${statuses}"
              th:value="${status}"
              th:text="${status}">
      </option>

    </select>
  </div>

  <br>

  <button type="submit">Add vendor</button>

</form>

<hr>

<h2>Vendor list</h2>

<h3>Filter vendors</h3>

<form th:action="@{/vendors}" method="get">

  <label for="filterServiceType">Service type::</label>

  <select id="filterServiceType" name="serviceType">

    <option value="">All</option>

    <option th:each="type : ${serviceTypes}"
            th:value="${type}"
            th:text=${type}>
    </option>

  </select>

  <label for="filterStatus">Status:</label>

  <select id="filterStatus" name="status">

    <option value="">All</option>

    <option th:each="status : ${statuses}"
            th:value="${status}"
            th:text=${status}>
    </option>

  </select>

  <button type="submit">Filter</button>

</form>

<br>

<a th:href="@{/vendors}">Clear filter</a>

<p th:if="${vendors.isEmpty()}">
  No vendors found.
</p>

<table th:if="${!vendors.isEmpty()}" border="1">

  <thead>
  <tr>
    <th>Name</th>
    <th>Service</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Estimated price</th>
    <th>Deposit</th>
    <th>Remaining</th>
    <th>Status</th>
    <th>Actions</th>

  </tr>
  </thead>

  <tbody>

  <tr th:each="vendor : ${vendors}">
    <td th:text="${vendor.name}"></td>
    <td th:text="${vendor.serviceType}"></td>
    <td th:text="${vendor.email}"></td>
    <td th:text="${vendor.phone}"></td>
    <td th:text="${vendor.estimatedPrice}"></td>
    <td th:text="${vendor.depositAmount}"></td>
    <td th:text="${vendor.remainingAmount}"></td>
    <td th:text="${vendor.status}"></td>

    <td>
      <a th:href="@{/vendors/edit/{id}(id=${vendor.id})}">
        Edit
      </a>

      <form th:action="@{/vendors/delete/{id}(id=${vendor.id})}"
            method="post"
            style="display:inline;">
        <button type="submit">Delete</button>
      </form>
    </td>
  </tr>

  </tbody>

</table>

</body>
</html>
