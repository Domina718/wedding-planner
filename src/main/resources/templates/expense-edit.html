<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Expense | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link" th:href="@{/guests}">Guests</a>
            <a class="nav-link" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link active" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link" th:href="@{/vendors}">Vendors</a>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">

        <h1 class="fw-bold">
            Edit expense
        </h1>

        <p class="text-muted">
            Update expense details and payment status.
        </p>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/expenses/update}"
                  th:object="${expense}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="description"
                               class="form-label">
                            Description
                        </label>

                        <input type="text"
                               id="description"
                               th:field="*{description}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">

                        <label for="amount"
                               class="form-label">
                            Amount
                        </label>

                        <input type="number"
                               id="amount"
                               th:field="*{amount}"
                               min="0"
                               step="0.01"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">

                        <label for="category"
                               class="form-label">
                            Category
                        </label>

                        <select id="category"
                                th:field="*{category}"
                                class="form-select">

                            <option th:each="category : ${categories}"
                                    th:value="${category}"
                                    th:text="${category}">
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6">

                        <label for="date"
                               class="form-label">
                            Date
                        </label>

                        <input type="date"
                               id="date"
                               th:field="*{date}"
                               class="form-control">
                    </div>

                </div>

                <div class="form-check mt-4">

                    <input type="checkbox"
                           id="paid"
                           th:field="*{paid}"
                           class="form-check-input">

                    <label for="paid"
                           class="form-check-label">
                        Paid
                    </label>

                </div>

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-dark">
                        Save changes
                    </button>

                    <a th:href="@{/expenses}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
