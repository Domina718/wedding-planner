<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Expense | Wedding Planner</title>
</head>
<body>

<h1>Edit expense</h1>

<form th:action="@{/expenses/update}"
      th:object="${expense}"
      method="post">

  <input type="hidden" th:field="*{id}">

  <div>
    <label for="description">Description:</label>
    <input type="text"
           id="description"
           th:field="*{description}"
           required>
  </div>

  <br>

  <div>
    <label for="amount">Amount:</label>
    <input type="number"
           id="amount"
           th:field="*{amount}"
           min="0"
           step="0.01"
           required>
  </div>

  <br>

  <div>
    <label for="category">Category:</label>

    <select id="category" th:field="*{category}">
      <option th:each="category : ${categories}"
              th:value="${category}"
              th:text="${category}">
      </option>
    </select>
  </div>

  <br>

  <div>
    <label for="date">Date:</label>
    <input type="date"
           id="date"
           th:field="*{date}">
  </div>

  <br>

  <div>
    <label for="paid">Paid:</label>
    <input type="checkbox"
           id="paid"
           th:field="*{paid}">
  </div>

  <br>

  <button type="submit">Save changes</button>

</form>

<br>

<a th:href="@{/expenses}">Back to expenses</a>

</body>
</html>
