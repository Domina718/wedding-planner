<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guests | Wedding Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            Wedding Planner
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link active" th:href="@{/guests}">Guests</a>
            <a class="nav-link" th:href="@{/tasks}">Tasks</a>
            <a class="nav-link" th:href="@{/expenses}">Expenses</a>
            <a class="nav-link" th:href="@{/vendors}">Vendors</a>
        </div>

    </div>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h1 class="fw-bold">Guests</h1>
        <p class="text-muted mb-0">
            Manage your wedding guest list and RSVP responses.
        </p>
    </div>

    <div class="card shadow-sm mb-5">
        <div class="card-body">

            <h4 class="card-title mb-4">Add guest</h4>

            <form th:action="@{/guests/save}"
                  th:object="${guest}"
                  method="post">

                <div class="row g-3">

                    <div class="col-md-6">

                        <label for="firstName" class="form-label">First name</label>
                        <input type="text"
                               id="firstName"
                               th:field="*{firstName}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">

                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text"
                               id="lastName"
                               th:field="*{lastName}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">

                        <label for="email" class="form-label">Email</label>
                        <input type="email"
                               id="email"
                               th:field="*{email}"
                               class="form-control">

                    </div>

                    <div class="col-md-6">

                        <label for="phone" class="form-label">Phone</label>
                        <input type="text"
                               id="phone"
                               th:field="*{phone}"
                               class="form-control">
                    </div>

                    <div class="col-md-6">

                        <label for="rsvpStatus" class="form-label">RSVP status</label>
                        <select id="rsvpStatus"
                                th:field="*{rsvpStatus}"
                                class="form-select">

                            <option th:each="status : ${rsvpStatuses}"
                                    th:value="${status}"
                                    th:text="${status}">
                            </option>

                        </select>

                    </div>


                </div>

                <div class="form-check mt-4">

                    <input type="checkbox"
                           id="plusOne"
                           th:field="*{plusOne}"
                           class="form-check-input">

                    <label for="plusOne" class="form-check-label">Plus one</label>

                </div>

                <div id="plusOneFields"
                     style="display:none;"
                     class="mt-3">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label for="plusOneFirstName" class="form-label">Plus-one first name:</label>

                            <input type="text"
                                   id="plusOneFirstName"
                                   th:field="*{plusOneFirstName}"
                                   class="form-control">

                        </div>

                        <div class="col-md-6">

                            <label for="plusOneLastName" class="form-label">Plus-one last name:</label>

                            <input type="text"
                                   id="plusOneLastName"
                                   th:field="*{plusOneLastName}"
                                   class="form-control">
                        </div>

                    </div>

                </div>

                <button type="submit" class="btn btn-dark mt-4">Add guest</button>

            </form>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h4 class="card-title mb-0">
                    Guest list
                </h4>

                <span class="text-muted">
          Total:
          <strong th:text="${guests.size()}"></strong>
        </span>

            </div>

            <div th:if="${guests.isEmpty()}" class="alert alert-secondary">
                No guests have been added yet.
            </div>

            <div th:if="${!guests.isEmpty()}"
                 class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>
                        <th>First name</th>
                        <th>Last name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>RSVP</th>
                        <th>Plus one</th>
                        <th>Plus one name</th>
                        <th>Actions</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="guest : ${guests}">

                        <td th:text="${guest.firstName}"></td>
                        <td th:text="${guest.lastName}"
                        </td>
                        <td th:text="${guest.email}"></td>
                        <td th:text="${guest.phone}"></td>
                        <td th:text="${guest.rsvpStatus}"></td>

                        <td>
              <span th:if="${guest.plusOne}">
                Yes
              </span>

                            <span th:unless="${guest.plusOne}">
                No
              </span>
                        </td>

                        <td>
              <span th:if="${guest.plusOne}"
                    th:text="${guest.plusOneFirstName + ' ' + guest.plusOneLastName}">
              </span>

                            <span th:unless="${guest.plusOne}">
                -
              </span>
                        </td>

                        <td>
                            <a th:href="@{/guests/edit/{id}(id=${guest.id})}"
                               class="btn btn-outline-dark btn-sm">
                                Edit
                            </a>

                            <form th:action="@{/guests/delete/{id}(id=${guest.id})}"
                                  method="post"
                                  class="d-inline">

                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    Delete
                                </button>
                            </form>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div class="mt-4">

        <a th:href="@{/}" class="btn btn-outline-secondary">
            Back to dashboard
        </a>

    </div>

</div>
<script>
  const plusOneCheckbox = document.getElementById("plusOne");
  const plusOneFields = document.getElementById("plusOneFields");

  function togglePlusOneFields(){
    if (plusOneCheckbox.checked){
      plusOneFields.style.display = "block";
    }
    else {
      plusOneFields.style.display = "none";
    }
  }

  plusOneCheckbox.addEventListener("change", togglePlusOneFields);

  togglePlusOneFields();

</script>

</body>
</html>
